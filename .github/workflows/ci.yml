# Integración continua de Horizonte.
# Comprueba cada cambio que llega a main (o que quiere llegar, en una pull request):
# primero la calidad del código y, solo si pasa, los tests.
name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con la caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar las dependencias exactas de package-lock.json
        run: npm ci

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Comprobar el formato con Prettier
        run: npm run format:check

  tests:
    name: Tests
    # Si la calidad falla, no se gastan minutos en los tests
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con la caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar las dependencias exactas de package-lock.json
        run: npm ci

      - name: Pasar los tests unitarios y de integración
        run: npm test
